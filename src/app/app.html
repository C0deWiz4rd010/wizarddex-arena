<div class="shell">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Desktop sidebar -->
  <aside class="sidebar" aria-label="Primary navigation">
    <a class="brand" routerLink="/">
      <span class="brand-mark" aria-hidden="true">&#x2727;</span>
      <span class="brand-text">
        <strong>WizardDex</strong>
        <small>Arena</small>
      </span>
    </a>
    <nav class="side-nav">
      <button type="button" class="side-search" (click)="openSearch()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>Search</span>
        <kbd>⌘K</kbd>
      </button>
      @for (item of navItems; track item.path) {
        <a
          class="side-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              [attr.d]="item.icon"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
    <p class="disclaimer">Fan-made project. Not affiliated. Data by PotterDB.</p>
  </aside>

  <!-- Main content -->
  <main id="main" class="content" tabindex="-1">
    @if (!online()) {
      <p class="offline-banner" role="status">
        <span aria-hidden="true">&#x26A1;</span> You're offline — showing cached spellbook data.
      </p>
    }
    <router-outlet />
  </main>

  <wda-toast-host />
  <wda-command-palette />

  <!-- Mobile bottom nav -->
  <nav class="bottom-nav" aria-label="Primary navigation">
    @for (item of primaryNav; track item.path) {
      <a
        class="bottom-link"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            [attr.d]="item.icon"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</div>
