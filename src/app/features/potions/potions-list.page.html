<wda-page-header
  title="Potions"
  subtitle="Brews, draughts and elixirs with their ingredients and side effects."
/>

<div class="controls">
  <label class="search">
    <span class="visually-hidden">Search potions by name</span>
    <input
      type="search"
      [formControl]="search"
      placeholder="Search by name…"
      autocomplete="off"
      enterkeyhint="search"
    />
    @if (searching()) {
      <span class="search-spinner" aria-hidden="true"></span>
    }
  </label>

  <div class="chips" role="group" aria-label="Filter by difficulty">
    @for (d of difficulties; track d) {
      <button
        type="button"
        class="chip"
        [class.active]="difficulty() === d"
        (click)="selectDifficulty(d)"
      >
        {{ d }}
      </button>
    }
  </div>

  <div class="toolbar">
    <wda-result-count [shown]="items().length" [total]="total()" noun="potions" [loading]="loading()" />
    <div class="toolbar-actions">
      <wda-sort-select [options]="sortOptions" [value]="sortValue()" (valueChange)="changeSort($event)" />
      @if (hasActiveFilters()) {
        <button type="button" class="clear-btn" (click)="clearFilters()">Clear filters</button>
      }
    </div>
  </div>
</div>

@if (loading()) {
  <div class="grid">
    @for (i of [1, 2, 3, 4, 5, 6, 7, 8]; track i) {
      <wda-skeleton-card />
    }
  </div>
} @else if (error()) {
  <wda-error-state (retry)="reload()" />
} @else if (items().length === 0) {
  <wda-empty-state title="No potions found" message="Try a different brew." />
} @else {
  <div class="grid">
    @for (potion of items(); track potion.id) {
      <wda-resource-card [resource]="potion" [subtitle]="potion.difficulty ?? 'Potion'" />
    }
  </div>
  @if (hasMore) {
    <div class="more">
      <button type="button" class="load-more" (click)="loadMore()" [disabled]="loadingMore()">
        {{ loadingMore() ? 'Brewing…' : 'Load more' }}
      </button>
    </div>
  }
}
