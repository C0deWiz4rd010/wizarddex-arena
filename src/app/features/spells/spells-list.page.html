<wda-page-header
  title="Spells"
  subtitle="Charms, curses, jinxes and hexes from across the wizarding world."
/>

<div class="controls">
  <label class="search">
    <span class="visually-hidden">Search spells by name</span>
    <input
      type="search"
      [formControl]="search"
      placeholder="Search by name…"
      autocomplete="off"
      enterkeyhint="search"
    />
    @if (searching()) {
      <span class="search-spinner" aria-hidden="true"></span>
    }
  </label>

  <div class="chips" role="group" aria-label="Filter by category">
    @for (c of categories; track c) {
      <button
        type="button"
        class="chip"
        [class.active]="category() === c"
        (click)="selectCategory(c)"
      >
        {{ c }}
      </button>
    }
  </div>

  <div class="toolbar">
    <wda-result-count [shown]="items().length" [total]="total()" noun="spells" [loading]="loading()" />
    <div class="toolbar-actions">
      <wda-sort-select [options]="sortOptions" [value]="sortValue()" (valueChange)="changeSort($event)" />
      @if (hasActiveFilters()) {
        <button type="button" class="clear-btn" (click)="clearFilters()">Clear filters</button>
      }
    </div>
  </div>
</div>

@if (loading()) {
  <div class="grid">
    @for (i of [1, 2, 3, 4, 5, 6, 7, 8]; track i) {
      <wda-skeleton-card />
    }
  </div>
} @else if (error()) {
  <wda-error-state (retry)="reload()" />
} @else if (items().length === 0) {
  <wda-empty-state title="No spells found" message="Try a different incantation." />
} @else {
  <div class="grid">
    @for (spell of items(); track spell.id) {
      <wda-resource-card [resource]="spell" [subtitle]="spell.category ?? spell.light ?? 'Spell'" />
    }
  </div>
  @if (hasMore) {
    <div class="more">
      <button type="button" class="load-more" (click)="loadMore()" [disabled]="loadingMore()">
        {{ loadingMore() ? 'Summoning…' : 'Load more' }}
      </button>
    </div>
  }
}
