<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WizardDex Arena</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="An interactive Harry Potter WizardDex and browser-game built on the PotterDB API."
    />
    <meta name="theme-color" content="#07050f" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=Fira+Code:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem('wda.settings.v1');
          var s = raw ? JSON.parse(raw) : null;
          var root = document.documentElement;
          root.setAttribute('data-theme', (s && s.theme) || 'dark');
          if (s && s.reducedMotion) root.setAttribute('data-motion', 'reduced');
          if (s && s.lowPower) root.setAttribute('data-power', 'low');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </body>
</html>
